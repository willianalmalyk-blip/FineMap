# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made upname: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: FineMap-debug-apk
          path: app/build/outputs/apk/debug/*.apk

plugins {
    id("com.android.application")
    id("org.jetbrains.kotlin.android")
}

android {
    namespace = "uz.finemap.offline"
    compileSdk = 35

    defaultConfig {
        applicationId = "uz.finemap.offline"
        minSdk = 26
        targetSdk = 35
        versionCode = 1
        versionName = "0.1.0-alpha"
    }

    buildTypes {
        release {
            isMinifyEnabled = false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation("androidx.core:core-ktx:1.15.0")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("com.google.android.material:material:1.12.0")
    implementation("org.maplibre.gl:android-sdk:13.7.1")
}

package uz.finemap.offline

import android.Manifest
import android.content.Context
import android.content.Intent
import android.content.pm.PackageManager
import android.location.Location
import android.location.LocationListener
import android.location.LocationManager
import android.net.Uri
import android.os.Bundle
import android.provider.OpenableColumns
import android.provider.Settings
import android.view.View
import android.widget.EditText
import android.widget.TextView
import android.widget.Toast
import androidx.activity.result.contract.ActivityResultContracts
import androidx.appcompat.app.AppCompatActivity
import androidx.core.content.ContextCompat
import com.google.android.material.dialog.MaterialAlertDialogBuilder
import org.json.JSONArray
import org.json.JSONObject
import org.maplibre.android.MapLibre
import org.maplibre.android.camera.CameraPosition
import org.maplibre.android.camera.CameraUpdateFactory
import org.maplibre.android.geometry.LatLng
import org.maplibre.android.maps.MapView
import org.maplibre.android.maps.MapLibreMap
import org.maplibre.android.style.layers.CircleLayer
import org.maplibre.android.style.layers.PropertyFactory.circleColor
import org.maplibre.android.style.layers.PropertyFactory.circleRadius
import org.maplibre.android.style.layers.PropertyFactory.circleStrokeColor
import org.maplibre.android.style.layers.PropertyFactory.circleStrokeWidth
import org.maplibre.android.style.sources.GeoJsonSource
import java.io.File
import java.util.Locale
import java.util.concurrent.Executors

class MainActivity : AppCompatActivity() {

    private lateinit var mapView: MapView
    private var map: MapLibreMap? = null
    private var selectedProject = "Olmaliq shahri"
    private var layers = mutableListOf<ImportedLayer>()
    private var currentLocation: Location? = null
    private var locationManager: LocationManager? = null
    private var shouldTrackLocation = false
    private val ioExecutor = Executors.newSingleThreadExecutor()

    private lateinit var tvMapStatus: TextView
    private lateinit var tvProjectName: TextView
    private lateinit var tvProjectPath: TextView
    private lateinit var tvLayerCountBadge: TextView
    private lateinit var tvGpsStatus: TextView
    private lateinit var tvCoordinates: TextView
    private lateinit var tvAccuracy: TextView
    private lateinit var viewGpsDot: View

    private val locationPermissionLauncher = registerForActivityResult(
        ActivityResultContracts.RequestMultiplePermissions()
    ) { result ->
        val fine = result[Manifest.permission.ACCESS_FINE_LOCATION] == true
        val coarse = result[Manifest.permission.ACCESS_COARSE_LOCATION] == true
        if (fine || coarse) {
            startGps()
        } else {
            updateGpsUi(false, "Joylashuv ruxsati berilmadi")
            Toast.makeText(this, "GPS uchun joylashuv ruxsati kerak", Toast.LENGTH_LONG).show()
        }
    }

    private val rasterPicker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
        uri?.let { importLayer(it, ImportKind.RASTER) }
    }

    private val dxfPicker = registerForActivityResult(ActivityResultContracts.OpenDocument()) { uri ->
        uri?.let { importLayer(it, ImportKind.DXF) }
    }

    private val locationListener = object : LocationListener {
        override fun onLocationChanged(location: Location) {
            currentLocation = location
            runOnUiThread {
                updateGpsUi(true, "GPS joylashuv topildi")
                tvCoordinates.text = String.format(
                    Locale.US,
                    "Lat %.6f   ·   Lon %.6f",
                    location.latitude,
                    location.longitude
                )
                tvAccuracy.text = if (location.hasAccuracy()) {
                    String.format(Locale.US, "± %.1f m", location.accuracy)
                } else {
                    "Aniqlik: —"
                }
                moveMapToLocation(location, zoom = 16.0)
                updateLocationMarker(location)
            }
        }

        @Deprecated("Deprecated by Android, still used for older location callback compatibility")
        override fun onStatusChanged(provider: String?, status: Int, extras: Bundle?) = Unit
        override fun onProviderEnabled(provider: String) = Unit
        override fun onProviderDisabled(provider: String) {
            runOnUiThread { updateGpsUi(false, "GPS o‘chirilgan") }
        }
    }

    override fun onCreate(savedInstanceState: Bundle?) {
        super.onCreate(savedInstanceState)
        MapLibre.getInstance(this)
        setContentView(R.layout.activity_main)

        selectedProject = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
            .getString("current_project", "Olmaliq shahri") ?: "Olmaliq shahri"

        mapView = findViewById(R.id.mapView)
        tvMapStatus = findViewById(R.id.tvMapStatus)
        tvProjectName = findViewById(R.id.tvProjectName)
        tvProjectPath = findViewById(R.id.tvProjectPath)
        tvLayerCountBadge = findViewById(R.id.tvLayerCountBadge)
        tvGpsStatus = findViewById(R.id.tvGpsStatus)
        tvCoordinates = findViewById(R.id.tvCoordinates)
        tvAccuracy = findViewById(R.id.tvAccuracy)
        viewGpsDot = findViewById(R.id.viewGpsDot)

        mapView.onCreate(savedInstanceState)
        mapView.getMapAsync { mapInstance ->
            map = mapInstance
            mapInstance.cameraPosition = CameraPosition.Builder()
                .target(LatLng(40.8448, 69.5983)) // Olmaliq shahri — boshlang‘ich ko‘rinish
                .zoom(12.0)
                .build()
            mapInstance.setStyle("https://tiles.openfreemap.org/styles/liberty") {
                tvMapStatus.text = "Onlayn bazaviy xarita · offline rejim keyingi bosqichda"
                currentLocation?.let { updateLocationMarker(it) }
            }
        }

        findViewById<View>(R.id.cardArea).setOnClickListener { showProjectPicker() }
        findViewById<View>(R.id.btnGps).setOnClickListener { startGps() }
        findViewById<View>(R.id.btnImport).setOnClickListener { showImportPicker() }
        findViewById<View>(R.id.btnLayers).setOnClickListener { showLayersDialog() }

        loadLayersForProject()
        updateProjectUi()
        updateGpsUi(false, "GPS hali yoqilmagan")
    }

    private fun showProjectPicker() {
        val choices = arrayOf(
            "Olmaliq shahri — demo hudud",
            "Yangi loyiha yaratish"
        )
        MaterialAlertDialogBuilder(this)
            .setTitle("Loyiha / hudud tanlash")
            .setItems(choices) { _, which ->
                when (which) {
                    0 -> selectProject("Olmaliq shahri")
                    1 -> showCreateProjectDialog()
                }
            }
            .setNegativeButton("Bekor qilish", null)
            .show()
    }

    private fun showCreateProjectDialog() {
        val input = EditText(this).apply {
            hint = "Masalan: Yangi kon uchastkasi"
            setSingleLine(true)
            setPadding(dp(18), dp(12), dp(18), dp(12))
        }
        MaterialAlertDialogBuilder(this)
            .setTitle("Yangi loyiha")
            .setMessage("Loyiha nomini kiriting. Hudud chegarasi va koordinata tizimini keyingi bosqichda sozlaymiz.")
            .setView(input)
            .setPositiveButton("Yaratish") { _, _ ->
                val name = input.text.toString().trim()
                if (name.isNotBlank()) selectProject(name)
                else Toast.makeText(this, "Loyiha nomini kiriting", Toast.LENGTH_SHORT).show()
            }
            .setNegativeButton("Bekor qilish", null)
            .show()
    }

    private fun selectProject(name: String) {
        selectedProject = name
        getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
            .edit().putString("current_project", name).apply()
        loadLayersForProject()
        updateProjectUi()
        if (name.contains("Olmaliq", ignoreCase = true)) {
            map?.animateCamera(CameraUpdateFactory.newLatLngZoom(LatLng(40.8448, 69.5983), 12.0))
        }
    }

    private fun updateProjectUi() {
        tvProjectName.text = selectedProject
        tvProjectPath.text = if (selectedProject.contains("Olmaliq", ignoreCase = true)) {
            "O‘zbekiston · Toshkent viloyati · ${layers.size} qatlam"
        } else {
            "Mahalliy loyiha · ${layers.size} qatlam"
        }
        tvLayerCountBadge.text = "${layers.size} QATLAM"
    }

    private fun showImportPicker() {
        MaterialAlertDialogBuilder(this)
            .setTitle("Ma’lumot import qilish")
            .setItems(arrayOf("Aerofotosyomka  (.tif, .tiff, .ecw)", "Poligonlar  (.dxf)")) { _, which ->
                when (which) {
                    0 -> rasterPicker.launch(arrayOf("*/*"))
                    1 -> dxfPicker.launch(arrayOf("*/*"))
                }
            }
            .setNegativeButton("Bekor qilish", null)
            .show()
    }

    private fun importLayer(uri: Uri, kind: ImportKind) {
        val displayName = getDisplayName(uri) ?: "import_${System.currentTimeMillis()}"
        val lowerName = displayName.lowercase(Locale.ROOT)
        val extensionValid = when (kind) {
            ImportKind.RASTER -> lowerName.endsWith(".tif") || lowerName.endsWith(".tiff") || lowerName.endsWith(".ecw")
            ImportKind.DXF -> lowerName.endsWith(".dxf")
        }
        if (!extensionValid) {
            val expected = if (kind == ImportKind.RASTER) ".tif, .tiff yoki .ecw" else ".dxf"
            MaterialAlertDialogBuilder(this)
                .setTitle("Format mos emas")
                .setMessage("Tanlangan fayl: $displayName\nKutilgan format: $expected")
                .setPositiveButton("Tushunarli", null)
                .show()
            return
        }

        val projectAtImport = selectedProject
        Toast.makeText(this, "Fayl loyihaga ko‘chirilmoqda…", Toast.LENGTH_SHORT).show()
        ioExecutor.execute {
            try {
                val parent = getExternalFilesDir(null) ?: filesDir
                val projectDirectory = File(parent, "projects/${safeFileName(projectAtImport)}/imports")
                if (!projectDirectory.exists() && !projectDirectory.mkdirs()) {
                    throw IllegalStateException("Loyiha papkasini yaratib bo‘lmadi")
                }
                val safeName = safeFileName(displayName)
                val destination = File(projectDirectory, "${System.currentTimeMillis()}_$safeName")
                contentResolver.openInputStream(uri).use { input ->
                    if (input == null) throw IllegalStateException("Faylni ochib bo‘lmadi")
                    destination.outputStream().buffered().use { output -> input.copyTo(output) }
                }
                val fileType = if (kind == ImportKind.DXF) "DXF poligon" else "Aerofotosyomka"
                val item = ImportedLayer(displayName, fileType, destination.absolutePath, destination.length())
                runOnUiThread {
                    if (selectedProject == projectAtImport) {
                        layers.add(item)
                        persistLayersForProject()
                        updateProjectUi()
                    } else {
                        persistLayerToProject(projectAtImport, item)
                    }
                    MaterialAlertDialogBuilder(this)
                        .setTitle("Import saqlandi")
                        .setMessage(
                            "$displayName\n\nHajmi: ${formatBytes(destination.length())}\nLoyiha: $projectAtImport\n\nHozirgi prototip faylni telefonda saqlaydi. Uni xaritada qatlam sifatida chizish, koordinata tizimini tekshirish va poligon ichidaligini hisoblash keyingi GIS bosqichida qo‘shiladi."
                        )
                        .setPositiveButton("OK", null)
                        .show()
                }
            } catch (e: Exception) {
                runOnUiThread {
                    MaterialAlertDialogBuilder(this)
                        .setTitle("Import amalga oshmadi")
                        .setMessage(e.localizedMessage ?: "Faylni o‘qishda noma’lum xatolik yuz berdi.")
                        .setPositiveButton("OK", null)
                        .show()
                }
            }
        }
    }

    private fun showLayersDialog() {
        if (layers.isEmpty()) {
            MaterialAlertDialogBuilder(this)
                .setTitle("Loyiha qatlamlari")
                .setMessage("Hozircha qatlam import qilinmagan. “Import” tugmasi orqali GeoTIFF/TIFF, ECW yoki DXF fayl tanlang.")
                .setPositiveButton("Import qilish") { _, _ -> showImportPicker() }
                .setNegativeButton("Yopish", null)
                .show()
            return
        }

        val message = layers.mapIndexed { index, layer ->
            "${index + 1}. ${layer.name}\n   ${layer.type} · ${formatBytes(layer.sizeBytes)}"
        }.joinToString("\n\n")
        MaterialAlertDialogBuilder(this)
            .setTitle("Qatlamlar · ${layers.size}")
            .setMessage(message)
            .setPositiveButton("Yana import") { _, _ -> showImportPicker() }
            .setNegativeButton("Yopish", null)
            .show()
    }

    private fun startGps() {
        shouldTrackLocation = true
        val fineGranted = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED
        val coarseGranted = ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED
        if (!fineGranted && !coarseGranted) {
            locationPermissionLauncher.launch(arrayOf(
                Manifest.permission.ACCESS_FINE_LOCATION,
                Manifest.permission.ACCESS_COARSE_LOCATION
            ))
            return
        }

        val manager = getSystemService(Context.LOCATION_SERVICE) as LocationManager
        locationManager = manager
        val gpsEnabled = try { manager.isProviderEnabled(LocationManager.GPS_PROVIDER) } catch (_: Exception) { false }
        if (!gpsEnabled) {
            MaterialAlertDialogBuilder(this)
                .setTitle("GPS yoqilmagan")
                .setMessage("Joriy joylashuvni xaritada ko‘rish uchun telefon sozlamalarida Location/GPS ni yoqing.")
                .setPositiveButton("Sozlamalarni ochish") { _, _ ->
                    startActivity(Intent(Settings.ACTION_LOCATION_SOURCE_SETTINGS))
                }
                .setNegativeButton("Keyinroq", null)
                .show()
            updateGpsUi(false, "GPS yoqilishini kutmoqda")
            return
        }

        try {
            updateGpsUi(false, "GPS signali qidirilmoqda…")
            val last = try { manager.getLastKnownLocation(LocationManager.GPS_PROVIDER) } catch (_: SecurityException) { null }
            if (last != null) {
                currentLocation = last
                tvCoordinates.text = String.format(Locale.US, "Lat %.6f   ·   Lon %.6f", last.latitude, last.longitude)
                tvAccuracy.text = if (last.hasAccuracy()) String.format(Locale.US, "± %.1f m", last.accuracy) else "Aniqlik: —"
                moveMapToLocation(last, zoom = 15.0)
                updateLocationMarker(last)
            }
            manager.requestLocationUpdates(LocationManager.GPS_PROVIDER, 1500L, 1f, locationListener)
        } catch (e: SecurityException) {
            updateGpsUi(false, "GPS ruxsati mavjud emas")
        } catch (e: Exception) {
            updateGpsUi(false, "GPS ishga tushmadi")
            Toast.makeText(this, e.localizedMessage ?: "GPS bilan bog‘liq xato", Toast.LENGTH_LONG).show()
        }
    }

    private fun updateGpsUi(active: Boolean, status: String) {
        tvGpsStatus.text = status
        viewGpsDot.setBackgroundResource(if (active) R.drawable.gps_dot_on else R.drawable.gps_dot_off)
        if (!active && currentLocation == null) tvAccuracy.text = "Aniqlik: —"
    }

    private fun moveMapToLocation(location: Location, zoom: Double) {
        map?.animateCamera(
            CameraUpdateFactory.newLatLngZoom(LatLng(location.latitude, location.longitude), zoom)
        )
    }

    private fun updateLocationMarker(location: Location) {
        map?.getStyle { style ->
            val data = """{"type":"Feature","geometry":{"type":"Point","coordinates":[${location.longitude},${location.latitude}]},"properties":{}}"""
            val source = style.getSourceAs<GeoJsonSource>(LOCATION_SOURCE_ID)
            if (source == null) {
                style.addSource(GeoJsonSource(LOCATION_SOURCE_ID, data))
                style.addLayer(
                    CircleLayer(LOCATION_LAYER_ID, LOCATION_SOURCE_ID).withProperties(
                        circleRadius(8f),
                        circleColor("#1677FF"),
                        circleStrokeColor("#FFFFFF"),
                        circleStrokeWidth(2.5f)
                    )
                )
            } else {
                source.setGeoJson(data)
            }
        }
    }

    private fun getDisplayName(uri: Uri): String? {
        contentResolver.query(uri, arrayOf(OpenableColumns.DISPLAY_NAME), null, null, null)?.use { cursor ->
            if (cursor.moveToFirst()) {
                val index = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                if (index >= 0) return cursor.getString(index)
            }
        }
        return uri.lastPathSegment?.substringAfterLast('/')
    }

    private fun loadLayersForProject() {
        layers = mutableListOf()
        val raw = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
            .getString(layerPreferenceKey(), "[]") ?: "[]"
        try {
            val array = JSONArray(raw)
            for (i in 0 until array.length()) {
                val item = array.getJSONObject(i)
                val path = item.optString("path")
                // Do not display stale records if a file has been removed from storage.
                if (File(path).exists()) {
                    layers.add(
                        ImportedLayer(
                            item.optString("name"),
                            item.optString("type"),
                            path,
                            item.optLong("sizeBytes", File(path).length())
                        )
                    )
                }
            }
        } catch (_: Exception) {
            layers = mutableListOf()
        }
    }

    private fun persistLayerToProject(projectName: String, layer: ImportedLayer) {
        val preferences = getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
        val key = "layers_${safeFileName(projectName)}"
        val array = try { JSONArray(preferences.getString(key, "[]") ?: "[]") } catch (_: Exception) { JSONArray() }
        array.put(JSONObject().apply {
            put("name", layer.name)
            put("type", layer.type)
            put("path", layer.path)
            put("sizeBytes", layer.sizeBytes)
        })
        preferences.edit().putString(key, array.toString()).apply()
    }

    private fun persistLayersForProject() {
        val array = JSONArray()
        layers.forEach { layer ->
            array.put(JSONObject().apply {
                put("name", layer.name)
                put("type", layer.type)
                put("path", layer.path)
                put("sizeBytes", layer.sizeBytes)
            })
        }
        getSharedPreferences(PREFS_NAME, Context.MODE_PRIVATE)
            .edit().putString(layerPreferenceKey(), array.toString()).apply()
    }

    private fun layerPreferenceKey() = "layers_${safeFileName(selectedProject)}"

    private fun safeFileName(value: String): String = value
        .trim()
        .replace(Regex("[^A-Za-z0-9._-]+"), "_")
        .trim('_', '.')
        .ifBlank { "project" }
        .take(80)

    private fun formatBytes(bytes: Long): String = when {
        bytes >= 1024L * 1024L * 1024L -> String.format(Locale.US, "%.2f GB", bytes / (1024.0 * 1024.0 * 1024.0))
        bytes >= 1024L * 1024L -> String.format(Locale.US, "%.1f MB", bytes / (1024.0 * 1024.0))
        bytes >= 1024L -> String.format(Locale.US, "%.1f KB", bytes / 1024.0)
        else -> "$bytes B"
    }

    private fun dp(value: Int): Int = (value * resources.displayMetrics.density).toInt()

    override fun onStart() {
        super.onStart()
        mapView.onStart()
    }

    override fun onResume() {
        super.onResume()
        mapView.onResume()
        if (shouldTrackLocation && hasLocationPermission()) startGps()
    }

    override fun onPause() {
        locationManager?.let { manager ->
            try { manager.removeUpdates(locationListener) } catch (_: Exception) { }
        }
        mapView.onPause()
        super.onPause()
    }

    override fun onStop() {
        mapView.onStop()
        super.onStop()
    }

    override fun onLowMemory() {
        super.onLowMemory()
        mapView.onLowMemory()
    }

    override fun onSaveInstanceState(outState: Bundle) {
        super.onSaveInstanceState(outState)
        mapView.onSaveInstanceState(outState)
    }

    override fun onDestroy() {
        locationManager?.let { manager ->
            try { manager.removeUpdates(locationListener) } catch (_: Exception) { }
        }
        ioExecutor.shutdown()
        mapView.onDestroy()
        super.onDestroy()
    }

    private fun hasLocationPermission(): Boolean =
        ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_FINE_LOCATION) == PackageManager.PERMISSION_GRANTED ||
            ContextCompat.checkSelfPermission(this, Manifest.permission.ACCESS_COARSE_LOCATION) == PackageManager.PERMISSION_GRANTED

    private enum class ImportKind { RASTER, DXF }

    private data class ImportedLayer(
        val name: String,
        val type: String,
        val path: String,
        val sizeBytes: Long
    )

    companion object {
        private const val PREFS_NAME = "finemap_preferences"
        private const val LOCATION_SOURCE_ID = "current-location-source"
        private const val LOCATION_LAYER_ID = "current-location-circle"
    }
}

