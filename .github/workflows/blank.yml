# FineMap — Android boshlang‘ich prototipi

**Maqsad:** kon muhandisi uchun hudud bo‘yicha ishlaydigan, kelajakda offline xarita, dron aerofotosyomkasi, DXF poligonlari va GPS joylashuvini birlashtiradigan Android ilova yaratish.

## Hozirgi prototipda ishlaydigan qismlar

- Android uchun Kotlin loyihasi.
- MapLibre orqali Olmaliq atrofida ochiladigan bazaviy onlayn xarita.
- Loyiha/hudud tanlash: boshlang‘ich Olmaliq demo loyihasi va yangi loyiha nomini kiritish.
- Telefon GPS ruxsatini so‘rash, GPS holatini tekshirish, joylashuv va taxminiy aniqlikni ko‘rsatish.
- GPS nuqtasini xaritada belgilash va kamerani joylashuvga olib borish.
- `.tif`, `.tiff`, `.ecw` yoki `.dxf` faylini tanlash, loyiha papkasiga nusxalash va import qilingan qatlamlar ro‘yxatida saqlash.
- Loyiha nomi va import qilingan fayllar ro‘yxatini ilova qayta ochilganda saqlab qolish.

## Hozircha tayyor bo‘lmagan qismlar — muhim

Bu **0.1.0-alpha boshlang‘ich manba kodi**, tayyor ishlab chiqarish ilovasi emas. Hali quyidagi funksiyalar qo‘shilmagan:

1. Tanlangan hudud bazaviy xaritasini offline yuklab olish va internet yo‘q paytda ko‘rsatish.
2. GeoTIFF/TIFF tasvirini georeferensiyasi bilan xaritada raster qatlam sifatida chizish.
3. ECW faylini ochish. Android uchun ECW o‘qish kutubxonasi va litsenziya talabi alohida hal qilinadi.
4. DXF ichidagi poliliniya/poligonlarni o‘qish va xaritada chizish.
5. Koordinata tizimi (CRS), datum, o‘lchov birligi va transformatsiyani aniqlash.
6. GPS koordinatasi poligon ichidami yoki tashqarisidami — point-in-polygon hisoblash.
7. Poligon chegarasiga yaqinlashish ogohlantirishi, GPS trek, masofa/maydon o‘lchash va eksport.

Import tugmasi faylni **saqlaydi**, ammo ushbu versiyada uni hali geospatial qatlam sifatida xaritada ko‘rsatmaydi. Fayl saqlandi degani koordinatalari tekshirildi yoki geodezik jihatdan to‘g‘ri joylashtirildi degani emas.

## Texnologiyalar

- Kotlin + Android Views
- MapLibre Native Android: bazaviy xarita renderer’i
- OpenFreeMap Liberty style: boshlang‘ich onlayn fon xaritasi
- Android LocationManager: telefon GPS’i
- Android Storage Access Framework: foydalanuvchi tanlagan fayllarni import qilish

## Android Studio’da ishga tushirish

1. Kompyuterga Android Studio va mos Android SDK (API 35) o‘rnating.
2. `FineMap` papkasini Android Studio’da **Open** orqali oching.
3. Gradle sinxronizatsiyasi uchun internet kerak bo‘ladi: plaginlar va kutubxonalar yuklab olinadi.
4. Agar Android Studio Gradle Wrapper fayllari yo‘qligi haqida ogohlantirsa, IDE taklif qilgan usul bilan wrapper yarating (`gradle wrapper --gradle-version 8.10.2`) yoki Android Studio’ning Gradle sozlamalari orqali loyihani sinxronlang. Ushbu paketga wrapper JAR qo‘shilmagan.
5. Android telefonni USB debugging bilan ulang yoki emulator tanlang.
6. **Run** tugmasini bosing. Birinchi ishga tushishda internetli aloqa kerak: bazaviy xarita internetdan olinadi.

## Sinov tartibi

1. Ilovani oching — xarita Olmaliq atrofida ko‘rinishi kerak.
2. `GPS` ni bosing, joylashuv ruxsatini bering va telefonning Location/GPS funksiyasini yoqing.
3. Joylashuv topilganda koordinata hamda xaritadagi ko‘k nuqta yangilanishini tekshiring.
4. `Import` orqali test `.tif/.tiff/.ecw` yoki `.dxf` faylini tanlang.
5. Import yakunida “Qatlam” oynasida nomi va fayl hajmini tekshiring.
6. Ilovani yopib qayta oching va fayl ro‘yxati saqlanganini tekshiring.

## Geospatial ishlab chiqish uchun keyingi qarorlar

Raster va DXF qatlamlarini xavfsiz qo‘shishdan oldin har bir faylning koordinata tizimi aniqlanishi shart. Geografik koordinatalarni (lat/lon), UTM kabi proyeksiyalangan koordinatalarni va loyiha ichidagi lokal koordinatalarni bir-biriga to‘g‘ri transformatsiya qilish kerak. Bunda GDAL/PROJ yoki ekvivalent sinovdan o‘tgan geospatial kutubxona tanlanadi. ECW Android o‘qish imkoniyati ham alohida tekshiriladi.

**Tavsiya etilgan ketma-ketlik:** (1) Android’da GeoTIFF’ni o‘qish va extent/CRS ko‘rish; (2) DXF poligonlarini qatlamga chiqarish; (3) CRS transformatsiyasi va point-in-polygon testi; (4) offline xarita va katta rasterlar uchun optimallashtirish; (5) RTK GNSS va ogohlantirishlar.

## Rasmiy texnik manbalar

- MapLibre Native Android: https://maplibre.org/maplibre-native/android/
- OpenFreeMap: https://openfreemap.org/
- GDAL Android build ma’lumoti: https://gdal.org/en/stable/download.html
- Hexagon ECW SDK litsenziyalash: https://bynder.hexagon.com/m/5af86a8895f6696f/original/Hexagon_GSP_ERDAS_ECW_JP2_SDK_5_5_User_Guide.pdf

# FineMap texnik yo‘l xaritasi

## 0.1 — Boshlang‘ich prototip
- [x] Android loyiha tuzilmasi
- [x] Bazaviy onlayn xarita oynasi
- [x] Hudud/loyiha tanlash va nomini saqlash
- [x] GPS ruxsati va joriy joylashuv belgisi
- [x] TIFF/ECW/DXF fayllarini tanlash va loyiha papkasiga nusxalash
- [x] Import ro‘yxatini saqlash
- [ ] Qurilmada build va real GPS sinovi — Android SDK/telefon kerak

## 0.2 — Raster qatlam
- [ ] GeoTIFF metadata va CRS ni aniqlash
- [ ] Raster extent va piksel o‘lchamlarini o‘qish
- [ ] Katta raster uchun piramida/overviews yoki tiling
- [ ] Raster layerni xaritada ko‘rsatish
- [ ] Loyiha ichida qatlam ko‘rinishini yoqish/o‘chirish
- [ ] Oddiy TIFF uchun georeferensiya faylini (masalan, world file + projection) tekshirish

## 0.3 — DXF va geometriya
- [ ] DXF entity/layer ro‘yxatini o‘qish
- [ ] Yopiq polyline/poligonlarni aniqlash
- [ ] DXF chizma birliklari va koordinata tizimini ko‘rsatish
- [ ] CRS tanlash va koordinata transformatsiyasi
- [ ] Poligonni xaritada chizish
- [ ] GPS nuqtasi poligon ichida ekanini hisoblash
- [ ] Chegara yaqinida GPS aniqligi bo‘yicha ogohlantirish

## 0.4 — Offline va dala ishlar
- [ ] Tanlangan bazaviy xarita hududini offline yuklab olish
- [ ] Import qilingan raster va DXF ma’lumotlarini to‘liq offline ishlatish
- [ ] Masofa/maydon o‘lchash
- [ ] GPS trek yozish, CSV/GPX/KML eksporti
- [ ] Nuqta izohi va foto biriktirish
- [ ] Ilova ichida fayl hajmi va bo‘sh xotira nazorati

## 0.5 — Ishonchlilik va chiqarish
- [ ] Real kon hududidagi test dataset bilan sinash
- [ ] Turli CRS va katta fayl sinovlari
- [ ] GPS aniqligi va noaniqlik indikatorlari
- [ ] Ma’lumotlarni zaxiralash va versiyalash
- [ ] Android imzolangan release APK va qurilma sinovi

